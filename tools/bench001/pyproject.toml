[project]
name = "bench001"
version = "0.1.0"
description = "SPEC-001 EdgeQuake HybridRAG vs LightRAG on GraphRAG-Bench"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "huggingface_hub>=0.23",
]

[project.scripts]
bench001 = "bench001.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench001*"]
