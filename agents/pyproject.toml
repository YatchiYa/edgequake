[project]
name = "edgequake-agents"
version = "0.1.0"
description = "Google ADK agents built on EdgeQuake (graph-RAG)"
requires-python = ">=3.10"
dependencies = [
    "google-adk[mcp]==2.11.0",
    "litellm==1.105.1",
    "httpx>=0.27",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the running EdgeQuake + LLM (skipped unless EDGEQUAKE_API_KEY is set)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgequake_agents"]
