<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeQuake Agents</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b76;
    --border: #e3e3e8; --accent: #2f6fde; --user: #e8f0fe; --chip: #eef0f4; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --panel: #1d1d22; --text: #ececf1; --muted: #9a9aa6;
      --border: #2e2e36; --accent: #6ea0ff; --user: #23314d; --chip: #2a2a33; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .desc { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  select, button, textarea { font: inherit; color: inherit; }
  select, button { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .log { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 80%; white-space: pre-wrap; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.error { color: var(--err); }
  .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
  .msg pre, .msg code { background: var(--chip); border-radius: 6px; }
  .msg pre { padding: 8px; overflow-x: auto; } .msg code { padding: 1px 4px; }
  .msg table { border-collapse: collapse; } .msg td, .msg th { border: 1px solid var(--border); padding: 3px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--muted);
          font-family: ui-monospace, monospace; }
  .chip.done::after { content: " \2713"; }
  .artifact { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .artifact .bar { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 13px; color: var(--muted);
                   border-bottom: 1px solid var(--border); }
  .artifact img { display: block; max-width: 100%; background: #fff; }
  .artifact iframe { display: block; width: 100%; height: 520px; border: 0; background: #fff; }
  .artifact .md { padding: 4px 16px; max-height: 520px; overflow-y: auto; }
  .artifact pre { margin: 0; padding: 12px; white-space: pre-wrap; font-size: 13px; }
  footer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
             background: var(--bg); min-height: 42px; max-height: 160px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
</style>
</head>
<body>
<header>
  <h1>EdgeQuake Agents</h1>
  <label>Agent <select id="agent" aria-label="Agent"></select></label>
  <button id="new" type="button">New session</button>
  <span class="desc" id="desc"></span>
</header>
<main><div class="log" id="log"><p class="empty">Pick an agent and ask a question.</p></div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), agentSel = $("agent");
let userId, sessionId = null, apps = [];
try { userId = localStorage.getItem("eqUser") || ("u-" + crypto.randomUUID().slice(0, 8)); localStorage.setItem("eqUser", userId); }
catch { userId = "u-" + crypto.randomUUID().slice(0, 8); }

const md = (s) => (window.marked && window.DOMPurify)
  ? DOMPurify.sanitize(marked.parse(s))
  : s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/\n/g, "<br>");

function add(cls, html) {
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  if (html !== undefined) el.innerHTML = html;
  log.appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function loadApps() {
  try { apps = (await api("/list-apps?detailed=true")).apps; }
  catch { apps = (await api("/list-apps")).map((name) => ({ name })); }
  agentSel.innerHTML = apps.map((a) => `<option value="${a.name}">${a.name}</option>`).join("");
  const saved = (() => { try { return localStorage.getItem("eqAgent"); } catch { return null; } })();
  if (apps.some((a) => a.name === saved)) agentSel.value = saved;
  await newSession();
}

async function newSession() {
  const app = agentSel.value;
  try { localStorage.setItem("eqAgent", app); } catch {}
  $("desc").textContent = apps.find((a) => a.name === app)?.description || "";
  log.innerHTML = '<p class="empty">New session with <b></b>. Ask a question.</p>';
  log.querySelector("b").textContent = app;
  sessionId = null; $("send").disabled = true;
  sessionId = (await api(`/apps/${app}/users/${userId}/sessions`, { method: "POST", body: "{}" })).id;
  $("send").disabled = false;
}

const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

async function showArtifact(app, name, version) {
  const box = add("artifact");
  box.innerHTML = `<div class="bar"><span></span><a>download</a></div>`;
  box.querySelector("span").textContent = `${name} (v${version})`;
  try {
    const part = await api(`/apps/${app}/users/${userId}/sessions/${sessionId}/artifacts/${encodeURIComponent(name)}?version=${version}`);
    const { mimeType, data } = part.inlineData || part.inline_data;
    const bytes = b64(data), blob = new Blob([bytes], { type: mimeType });
    const link = box.querySelector("a");
    link.href = URL.createObjectURL(blob); link.download = name;
    if (mimeType.startsWith("image/")) {
      const img = document.createElement("img"); img.src = link.href; img.alt = name; box.appendChild(img);
    } else if (mimeType === "text/html") {
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts"); f.title = name;
      f.srcdoc = new TextDecoder().decode(bytes); box.appendChild(f);
    } else if (mimeType === "text/markdown") {
      const div = document.createElement("div"); div.className = "md"; div.innerHTML = md(new TextDecoder().decode(bytes)); box.appendChild(div);
    } else {
      const pre = document.createElement("pre"); pre.textContent = new TextDecoder().decode(bytes); box.appendChild(pre);
    }
  } catch (e) { box.appendChild(Object.assign(document.createElement("pre"), { textContent: "Could not load artifact: " + e.message })); }
}

async function send(text) {
  const app = agentSel.value;
  add("msg user").textContent = text;
  $("send").disabled = true;
  // One bubble per author: parallel sub-agents (researcher_1..n) stream interleaved deltas.
  let bubbles = {}, chips = null;
  const chipFor = {};
  const chip = (label, id) => {
    if (!chips) chips = add("chips");
    const c = document.createElement("span"); c.className = "chip"; c.textContent = label; chips.appendChild(c);
    if (id) chipFor[id] = c;
  };
  const plan = (s) => {  // investigator planner emits JSON (output_schema): show it as a list
    try { const p = JSON.parse(s); return "**Plan**\n\n" + p.sub_questions.map((q, i) => `${i + 1}. ${q}`).join("\n"); }
    catch { return s; }
  };
  const textOut = (author, t, partial) => {
    let b = bubbles[author];
    if (!b) {
      b = bubbles[author] = { el: add("msg", '<div class="who"></div><div class="body"></div>'), raw: "" };
      b.el.querySelector(".who").textContent = author; chips = null;
    }
    b.raw = partial ? b.raw + t : t;
    b.el.querySelector(".body").innerHTML = md(author === "planner" ? plan(b.raw) : b.raw);
    b.el.scrollIntoView({ block: "end" });
    if (!partial) delete bubbles[author];
  };
  try {
    const r = await fetch("/run_sse", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ appName: app, userId, sessionId, streaming: true,
                             newMessage: { role: "user", parts: [{ text }] } }),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.error) { add("msg error").textContent = ev.error; continue; }
        for (const p of ev.content?.parts || []) {
          if (p.text && !p.thought) textOut(ev.author, p.text, !!ev.partial);
          if (p.functionCall && !ev.partial) { delete bubbles[ev.author]; chip(`${ev.author} · ${p.functionCall.name}`, p.functionCall.id); }
          if (p.functionResponse) chipFor[p.functionResponse.id]?.classList.add("done");
        }
        if (ev.actions?.transferToAgent) chip("→ " + ev.actions.transferToAgent);
        for (const [name, v] of Object.entries(ev.actions?.artifactDelta || {})) { bubbles = {}; chips = null; await showArtifact(app, name, v); }
      }
    }
  } catch (e) { add("msg error").textContent = "Error: " + e.message; }
  $("send").disabled = false;
  input.focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || $("send").disabled) return;
  input.value = ""; send(t);
});
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
agentSel.addEventListener("change", newSession);
$("new").addEventListener("click", newSession);
loadApps().catch((e) => add("msg error").textContent = "Cannot reach the ADK server: " + e.message);
</script>
</body>
</html>
