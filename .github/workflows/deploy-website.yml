name: Deploy Website to GitHub Pages

on:
  push:
    branches: [edgequake-main]
    paths:
      - "edgequake-website/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Use Node.js 24 for GitHub Actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edgequake-website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: edgequake-website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: edgequake-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  enable-https:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTPS for custom domain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to enable HTTPS enforcement (only succeeds after cert is provisioned by GitHub)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"edgequake.com","https_enforced":true}')

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ HTTPS enforcement enabled for edgequake.com"
          else
            echo "⚠️  Certificate not yet provisioned (HTTP $HTTP_STATUS)."
            echo "    GitHub is provisioning the SSL cert for edgequake.com."
            echo "    HTTPS will be available within ~1 hour. Enable via:"
            echo "    https://github.com/${{ github.repository }}/settings/pages"
          fi
