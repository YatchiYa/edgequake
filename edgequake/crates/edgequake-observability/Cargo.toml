[package]
name = "edgequake-observability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Centralized tracing, metrics, and correlation for EdgeQuake"

[features]
default = ["metrics", "otel"]
# OTLP (Jaeger gRPC + Langfuse HTTP): on by default (SPEC-124). Disable with
# `--no-default-features --features metrics` if you need a slimmer binary.
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:reqwest",
    "dep:rustls",
]

[dependencies]
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
serde_json.workspace = true
http = "1"
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true }

opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing"], optional = true }
# SPEC-124: grpc-tonic (Jaeger) + http-proto (Langfuse OTLP/HTTP; gRPC unsupported by Langfuse).
# reqwest-rustls: HTTPS to cloud.langfuse.com / us.cloud… (reqwest 0.13 blocking has no TLS by default).
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
# SPEC-124b: native Langfuse ingestion transport (Langfuse 3.1 exposes no OTLP endpoint).
# TLS: `rustls-tls-native-roots` reads the OS trust store (and honours
# SSL_CERT_FILE). Plain `rustls-tls` would bundle Mozilla roots only, which
# rejects corporate/internal CAs — the OTLP path uses the system store via
# `reqwest/default-tls`, so the two transports must agree or self-hosted
# Langfuse behind an internal certificate works on one and fails on the other.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"], optional = true }
# rustls 0.23 requires an explicit process-default CryptoProvider for HTTPS (reqwest OTLP).
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
