[package]
name = "edgequake-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF to Markdown conversion backends for EdgeQuake"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
edgequake-llm = { workspace = true }
edgequake-pdf2md = { workspace = true }
edgeparse-core = { workspace = true }
regex = "1"
once_cell = "1"
base64 = "0.22"
image = "0.25"
serde_json = { workspace = true }
tempfile = "3"
# pdfium access goes through edgequake-pdf2md (shared singleton) — no direct pdfium deps.
[dev-dependencies]
serial_test = "3"
