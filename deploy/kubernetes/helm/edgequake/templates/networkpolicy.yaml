{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgequake-api-egress
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edgequake.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # EdgeQuake Postgres
    - to:
        - podSelector:
            matchLabels:
              {{- include "edgequake.postgres.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    # Langfuse OTLP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.langfuseNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgequake-web-egress
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edgequake.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              {{- include "edgequake.api.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.api.service.port }}
          protocol: TCP
{{- end }}
