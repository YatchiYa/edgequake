apiVersion: v1
kind: Secret
metadata:
  name: edgequake-api-secret
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: {{ include "edgequake.databaseUrl" . | quote }}
  {{- if and (not .Values.api.langfuse.existingSecret) .Values.api.langfuse.publicKey }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.api.langfuse.publicKey | quote }}
  {{- end }}
  {{- if and (not .Values.api.langfuse.existingSecret) .Values.api.langfuse.secretKey }}
  LANGFUSE_SECRET_KEY: {{ .Values.api.langfuse.secretKey | quote }}
  {{- end }}
  {{- range $key, $val := .Values.api.extraSecretEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
