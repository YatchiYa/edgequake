apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgequake.web.serviceName" . }}
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "edgequake.web.selectorLabels" . | nindent 4 }}
