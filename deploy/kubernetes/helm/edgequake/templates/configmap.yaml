apiVersion: v1
kind: ConfigMap
metadata:
  name: edgequake-api-config
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  {{- range $key, $val := .Values.api.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- if .Values.api.langfuse.baseUrl }}
  LANGFUSE_BASE_URL: {{ .Values.api.langfuse.baseUrl | quote }}
  {{- end }}
  {{- if .Values.api.langfuse.projectId }}
  LANGFUSE_PROJECT_ID: {{ .Values.api.langfuse.projectId | quote }}
  {{- end }}
  {{- range $key, $val := .Values.api.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
