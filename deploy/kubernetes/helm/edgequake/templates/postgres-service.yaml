{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: edgequake-postgres
  namespace: {{ include "edgequake.namespace" . }}
  labels:
    {{- include "edgequake.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "edgequake.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
