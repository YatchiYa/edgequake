# EdgeQuake on GCP — production overlay of docker-compose.quickstart.yml.
# Images are pinned (never latest). Caddy is the only published host port.
# Secrets come from /opt/<prefix>/.env (rendered from Secret Manager by render-env.sh).

services:
  postgres:
    image: ghcr.io/raphaelmansuy/edgequake-postgres:${EDGEQUAKE_POSTGRES_TAG}
    container_name: edgequake-postgres
    restart: unless-stopped
    shm_size: "256m"
    environment:
      POSTGRES_USER: edgequake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edgequake
    volumes:
      - ${EDGEQUAKE_DATA_MOUNT:-/mnt/edgequake-vm-data}/pgdata:/var/lib/postgresql
    networks:
      - edgequake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  migrate:
    image: ${EDGEQUAKE_IMAGE_REGISTRY}/edgequake:${EDGEQUAKE_VERSION}
    container_name: edgequake-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://edgequake:${POSTGRES_PASSWORD}@postgres:5432/edgequake
      EDGEQUAKE_MIGRATE_CLI: "1"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edgequake

  api:
    image: ${EDGEQUAKE_IMAGE_REGISTRY}/edgequake:${EDGEQUAKE_VERSION}
    container_name: edgequake-api
    restart: unless-stopped
    # Fresh /tmp on every (re)start: a half-extracted PDFium cache (PDFIUM_AUTO_CACHE_DIR
    # lives in /tmp) must not survive a restart and crash-loop the API.
    tmpfs:
      - /tmp:size=1g,exec # exec: PDFium loads its .so from here (Docker tmpfs defaults to noexec)
    environment:
      EDGEQUAKE_HOST: "0.0.0.0"
      EDGEQUAKE_PORT: "8080"
      DATABASE_URL: postgres://edgequake:${POSTGRES_PASSWORD}@postgres:5432/edgequake
      EDGEQUAKE_SCHEMA_GATE: ${EDGEQUAKE_SCHEMA_GATE:-wait}
      EDGEQUAKE_LLM_PROVIDER: ${EDGEQUAKE_LLM_PROVIDER:-openai}
      EDGEQUAKE_LLM_MODEL: ${EDGEQUAKE_LLM_MODEL:-}
      EDGEQUAKE_EMBEDDING_PROVIDER: ${EDGEQUAKE_EMBEDDING_PROVIDER:-}
      EDGEQUAKE_EMBEDDING_MODEL: ${EDGEQUAKE_EMBEDDING_MODEL:-}
      EDGEQUAKE_VISION_PROVIDER: ${EDGEQUAKE_VISION_PROVIDER:-${EDGEQUAKE_LLM_PROVIDER:-openai}}
      EDGEQUAKE_VISION_MODEL: ${EDGEQUAKE_VISION_MODEL:-${EDGEQUAKE_LLM_MODEL:-}}
      EDGEQUAKE_ALLOW_MOCK_PROVIDER: ${EDGEQUAKE_ALLOW_MOCK_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-${MISTRAL_API_KEY:-}}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      EDGEQUAKE_DECISION_ENABLED: ${EDGEQUAKE_DECISION_ENABLED:-1}
      EDGEQUAKE_DECISION_BASE_URL: ${EDGEQUAKE_DECISION_BASE_URL:-http://host.docker.internal:11434}
      PDFIUM_AUTO_CACHE_DIR: /tmp/edgequake-pdfium-cache
      RUST_LOG: ${RUST_LOG:-info}
      EDGEQUAKE_DEV_MODE: "false"
      EDGEQUAKE_AUTH_ENABLED: "true"
      EDGEQUAKE_PUBLIC_URL: ${EDGEQUAKE_PUBLIC_URL:-${EDGEQUAKE_API_URL}}
      EDGEQUAKE_CORS_ORIGINS: ${EDGEQUAKE_CORS_ORIGINS}
      EDGEQUAKE_BOOTSTRAP_ADMIN_USERNAME: ${EDGEQUAKE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      EDGEQUAKE_BOOTSTRAP_ADMIN_PASSWORD: ${EDGEQUAKE_BOOTSTRAP_ADMIN_PASSWORD}
      EDGEQUAKE_BOOTSTRAP_ADMIN_EMAIL: ${EDGEQUAKE_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      EDGEQUAKE_MASTER_API_KEY: ${EDGEQUAKE_MASTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edgequake
    healthcheck:
      test: ["CMD", "edgequake", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  frontend:
    image: ${EDGEQUAKE_IMAGE_REGISTRY}/edgequake-frontend:${EDGEQUAKE_VERSION}
    container_name: edgequake-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      EDGEQUAKE_API_URL: ${EDGEQUAKE_API_URL}
      NEXT_PUBLIC_AUTH_ENABLED: "true"
      NEXT_PUBLIC_DISABLE_DEMO_LOGIN: "true"
      # /api/copilot (Next route) calls the API server-to-server on the private network.
      EDGEQUAKE_INTERNAL_API_URL: http://api:8080
      AGENTS_INTERNAL_URL: http://agents:8765
      AGENTS_INTERNAL_TOKEN: ${AGENTS_INTERNAL_TOKEN}
      COPILOT_LLM_BASE_URL: ${COPILOT_LLM_BASE_URL:-}
      COPILOT_LLM_API_KEY: ${COPILOT_LLM_API_KEY:-}
      COPILOT_LLM_MODEL: ${COPILOT_LLM_MODEL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edgequake
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 25s

  agents:
    # Google ADK agents service (SPEC-165 /v1 API). Not published: only the web app
    # reaches it (http://agents:8765) after checking the EdgeQuake session.
    image: ${EDGEQUAKE_IMAGE_REGISTRY}/edgequake-agents:${EDGEQUAKE_VERSION}
    container_name: edgequake-agents
    restart: unless-stopped
    environment:
      EDGEQUAKE_URL: http://api:8080
      EDGEQUAKE_ADMIN_USERNAME: ${EDGEQUAKE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      EDGEQUAKE_ADMIN_PASSWORD: ${EDGEQUAKE_BOOTSTRAP_ADMIN_PASSWORD}
      EDGEQUAKE_TENANT_ID: ${AGENTS_TENANT_ID:-00000000-0000-0000-0000-000000000002}
      EDGEQUAKE_WORKSPACE_ID: ${AGENTS_WORKSPACE_ID:-00000000-0000-0000-0000-000000000003}
      EQ_AGENT_MODEL: ${AGENTS_MODEL:-mistral/mistral-medium-latest}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EQ_MAX_LLM_CALLS: "25"
      AGENTS_INTERNAL_TOKEN: ${AGENTS_INTERNAL_TOKEN}
      EQ_DATA_DIR: /data
    volumes:
      - agents-data:/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edgequake

  caddy:
    image: caddy:2.10-alpine
    container_name: edgequake-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - ./snippets.caddy:/etc/caddy/snippets.caddy:ro
      - ./certs/tls.crt:/etc/caddy/certs/tls.crt:ro
      - ./certs/tls.key:/etc/caddy/certs/tls.key:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      EDGEQUAKE_HOSTNAME: ${EDGEQUAKE_HOSTNAME:-}
    depends_on:
      - api
      - frontend
      - agents
    networks:
      - edgequake

networks:
  edgequake:
    driver: bridge

volumes:
  agents-data:
  caddy-data:
  caddy-config:
