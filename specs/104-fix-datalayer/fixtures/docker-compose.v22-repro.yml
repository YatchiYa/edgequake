# Isolated V22 repro for SPEC-104 (no fixed container_name — safe beside local stacks).
# Usage:
#   COMPOSE_PROJECT_NAME=eq104v22 EDGEQUAKE_VERSION=0.22.0 \
#     docker compose -f specs/104-fix-datalayer/fixtures/docker-compose.v22-repro.yml up -d
services:
  postgres:
    image: ghcr.io/raphaelmansuy/edgequake-postgres:${EDGEQUAKE_VERSION:-0.22.0}
    shm_size: "256m"
    environment:
      POSTGRES_USER: edgequake
      POSTGRES_PASSWORD: edgequake_secret
      POSTGRES_DB: edgequake
    ports:
      - "${SPEC104_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    image: ghcr.io/raphaelmansuy/edgequake:${EDGEQUAKE_VERSION:-0.22.0}
    ports:
      - "${SPEC104_API_PORT:-18080}:8080"
    environment:
      EDGEQUAKE_HOST: "0.0.0.0"
      EDGEQUAKE_PORT: "8080"
      DATABASE_URL: postgres://edgequake:edgequake_secret@postgres:5432/edgequake
      EDGEQUAKE_LLM_PROVIDER: ollama
      EDGEQUAKE_LLM_MODEL: gemma4:e4b
      EDGEQUAKE_EMBEDDING_PROVIDER: ollama
      OLLAMA_HOST: http://host.docker.internal:11434
      EDGEQUAKE_DEV_MODE: "true"
      EDGEQUAKE_AUTH_ENABLED: "false"
      EDGEQUAKE_ALLOW_MOCK_PROVIDER: "1"
      EDGEQUAKE_ALLOW_BOOT_MIGRATE: "1"
      RUST_LOG: info,edgequake_api::storage_inspector=debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
